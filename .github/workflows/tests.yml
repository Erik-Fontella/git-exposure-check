name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      # uv baixa qualquer versão do Python, inclusive a 3.9, que não vem mais nos runners do GitHub
      - uses: astral-sh/setup-uv@v6
      - name: Testes (pytest)
        run: uv run --no-project --python ${{ matrix.python-version }} --with-requirements requirements.txt python -m pytest -q
      - name: Demonstração de um comando (deve achar os 3 arquivos sensíveis falsos)
        run: |
          uv run --no-project --python ${{ matrix.python-version }} --with-requirements requirements.txt python main.py tests/fixtures/test_repo --no-strict | tee saida.txt
          grep -q "Foram encontrados 3 arquivo" saida.txt
